<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Google Meet Clone (Mobile Fix)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2 family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #202124;
            --bg-card: #3c4043;
            --bg-control: #303134;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --brand-blue: #8ab4f8;
            --brand-danger: #f28b82;
            --brand-success: #81c995;
            --brand-warning: #fdd663;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Google Sans', 'Roboto', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo-section h2 { font-size: 18px; font-weight: 500; }

        .room-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        .identity-badge {
            background-color: rgba(138, 180, 248, 0.1);
            border: 1px solid rgba(138, 180, 248, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--brand-blue);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Mobile Optimized Video Grid */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            padding: 12px;
            align-content: center;
            justify-content: center;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        @media (min-width: 768px) {
            main {
                grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
                gap: 16px;
                padding: 24px;
            }
        }

        .video-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
        }

        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .mirror { transform: scaleX(-1); }

        .user-tag {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(32, 33, 36, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 10;
        }

        /* Lobby Layer */
        #lobby-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 15px;
        }

        .lobby-box {
            background: #2d2e30;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        @media (min-width: 480px) {
            .lobby-box { padding: 40px; }
        }

        /* Request Popup */
        #request-popup {
            position: fixed;
            top: 15px; right: 15px; left: 15px;
            background: #2d2e30;
            border-left: 4px solid var(--brand-blue);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 200;
        }

        @media (min-width: 576px) {
            #request-popup { left: auto; width: 320px; }
        }

        .popup-buttons { display: flex; gap: 10px; margin-top: 12px; }

        /* Footer Controls */
        footer {
            background-color: var(--bg-main);
            padding: 16px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        @media (min-width: 768px) {
            footer { justify-content: space-between; }
        }

        .btn {
            background-color: var(--bg-control);
            color: var(--text-primary);
            border: none;
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }

        @media (min-width: 768px) {
            .btn { width: 48px; height: 48px; }
        }

        .btn:hover { background-color: #434649; }
        
        .btn-text {
            background-color: var(--brand-blue);
            color: #202124;
            padding: 0 16px;
            border-radius: 24px;
            font-weight: 500; font-size: 14px;
            width: auto; height: 44px;
            gap: 6px;
        }
        @media (min-width: 768px) {
            .btn-text { padding: 0 24px; font-size: 15px; height: 48px; gap: 8px; }
        }
        .btn-text:hover { background-color: #aacdff; }

        .btn-danger { background-color: var(--brand-danger); color: #202124; }
        .btn-danger:hover { background-color: #f7b2ac; }

        .btn.active-green { background-color: var(--brand-success); color: #202124; }
        .btn.active-red { background-color: var(--brand-danger); color: #202124; }

        .control-buttons { display: flex; gap: 10px; }
        
        .footer-spacer { display: none; width: 200px; }
        @media (min-width: 992px) { .footer-spacer { display: block; } }
    </style>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="lobby-overlay">
        <div class="lobby-box">
            <h1 style="margin-bottom: 24px; font-weight: 400; font-size: 24px;">Mera Google Meet</h1>
            <button id="create-room-btn" class="btn btn-text" style="width: 100%; justify-content: center; margin-bottom: 15px;">
                <span class="material-icons-outlined">video_call</span> Naya Room Banayein
            </button>
            <div style="color: var(--text-secondary); margin: 10px 0; font-size: 14px;">YA</div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="lobby-url-input" placeholder="Room ID ya Link dalein" style="width:100%; padding:12px; background:#3c4043; border:none; border-radius:8px; color:white; outline:none; text-align:center;">
                <button id="join-room-btn" class="btn btn-text" style="width:100%; justify-content:center;">Join</button>
            </div>
        </div>
    </div>

    <div id="request-popup">
        <p style="font-size: 14px;"><strong id="requester-name">Anjaan User</strong> meeting join karna chahta hai.</p>
        <div class="popup-buttons">
            <button id="accept-knock-btn" class="btn btn-text" style="height:36px; padding:0 16px; font-size:13px; background-color:var(--brand-success);">Allow</button>
            <button id="deny-knock-btn" class="btn btn-text" style="height:36px; padding:0 16px; font-size:13px; background-color:var(--brand-danger);">Deny</button>
        </div>
    </div>

    <header>
        <div class="logo-section">
            <h2>Mera Google Meet Clone</h2>
        </div>
        <div class="room-actions">
            <button id="copy-link-btn" class="btn btn-text" style="height:36px; padding: 0 12px; background: rgba(255,255,255,0.05); color: var(--brand-blue); border: 1px solid rgba(138,180,248,0.2); font-size: 13px;">
                <span class="material-icons-outlined" style="font-size:16px;">content_copy</span> Invite Link
            </button>
            <div class="identity-badge">
                <span class="material-icons-outlined" style="font-size: 16px;">room</span>
                Room ID: <span id="active-room-id" style="font-weight:bold; margin-left:4px;">-</span>
            </div>
        </div>
    </header>

    <main id="video-grid">
        <div class="video-card" id="local-card">
            <div class="user-tag">
                <span class="material-icons-outlined" style="font-size: 14px;">mic</span>
                Aap (Host/Me)
            </div>
            <video id="localVideo" class="mirror" autoplay playsinline muted></video>
        </div>
    </main>

    <footer>
        <div class="footer-spacer"></div>

        <div class="control-buttons">
            <button id="screenshare-btn" class="btn" title="Screen Share">
                <span class="material-icons-outlined">screen_share</span>
            </button>
            <button id="pip-btn" class="btn" title="Picture in Picture">
                <span class="material-icons-outlined">picture_in_picture_alt</span>
            </button>
            <button id="record-btn" class="btn" title="Record Call">
                <span class="material-icons-outlined">fiber_manual_record</span>
            </button>
            <button id="leave-btn" class="btn btn-danger" title="Leave Call" onclick="location.reload();">
                <span class="material-icons-outlined">call_end</span>
            </button>
        </div>
        
        <div class="footer-spacer"></div>
    </footer>

    <script>
        const videoGrid = document.getElementById('video-grid');
        const localVideo = document.getElementById('localVideo');
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const lobbyUrlInput = document.getElementById('lobby-url-input');
        const lobbyOverlay = document.getElementById('lobby-overlay');
        const activeRoomIdDisplay = document.getElementById('active-room-id');
        const copyLinkBtn = document.getElementById('copy-link-btn');
        
        const requestPopup = document.getElementById('request-popup');
        const requesterName = document.getElementById('requester-name');
        const acceptKnockBtn = document.getElementById('accept-knock-btn');
        const denyKnockBtn = document.getElementById('deny-knock-btn');

        const screenBtn = document.getElementById('screenshare-btn');
        const pipBtn = document.getElementById('pip-btn');
        const recordBtn = document.getElementById('record-btn');

        let localStream;
        let screenStream;
        let peer;
        let myId = "";
        let roomId = ""; 
        let isHost = false;
        let peersConnected = {}; 
        
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let isScreenSharing = false;
        let currentKnockConnection = null;

        let audioContext, audioDestination;

        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                lobbyUrlInput.value = roomParam;
            }
        });

        // FIXED Permission handler with descriptive alerts
        async function getMedia() {
            // Mobile environment fallback checking
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Aapka browser insecure (HTTP) hai ya yeh feature support nahi karta. Kripya HTTPS securely use karein.");
                throw new Error("Media API not available");
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640, max: 1280 }, // Mobile performance and aspect-ratio fallback
                        height: { ideal: 360, max: 720 },
                        facingMode: "user"
                    }, 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                localVideo.srcObject = localStream;
                return true;
            } catch (err) {
                console.error("Media permission error: ", err);
                alert("Permission Error: Kripya browser ke URL bar me Lage Lock (🔒) icon par click karke Camera aur Mic ko 'Allow' karein.");
                return false;
            }
        }

        function startPeerConnection() {
            return new Promise((resolve, reject) => {
                try {
                    peer = new Peer();
                    peer.on('open', (id) => {
                        myId = id;
                        resolve(id);
                    });

                    peer.on('connection', (conn) => {
                        handleIncomingDataConnection(conn);
                    });

                    peer.on('call', (call) => {
                        call.answer(localStream);
                        handleIncomingCall(call);
                    });

                    peer.on('error', (err) => {
                        console.error("PeerJS Error:", err);
                    });
                } catch(e) {
                    reject(e);
                }
            });
        }

        createRoomBtn.addEventListener('click', async () => {
            const hasMedia = await getMedia();
            if(!hasMedia) return; 
            
            await startPeerConnection();
            isHost = true;
            roomId = myId;
            activeRoomIdDisplay.innerText = roomId;
            lobbyOverlay.style.display = 'none';
        });

        joinRoomBtn.addEventListener('click', async () => {
            let inputVal = lobbyUrlInput.value.trim();
            if(!inputVal) return alert("Kripya valid Room ID ya link dalein.");
            
            if(inputVal.includes("?room=")) {
                const urlObj = new URL(inputVal);
                inputVal = urlObj.searchParams.get("room");
            }

            roomId = inputVal;
            
            const hasMedia = await getMedia();
            if(!hasMedia) return; 

            await startPeerConnection();
            
            isHost = false;
            activeRoomIdDisplay.innerText = roomId;
            lobbyOverlay.innerHTML = `<div class="lobby-box"><h2>Requesting Host...</h2><p>Host ke allow karne ka intezar karein.</p></div>`;
            
            const conn = peer.connect(roomId);
            conn.on('open', () => {
                conn.send({ type: 'knock-request', guestId: myId });
            });

            conn.on('data', (data) => {
                if(data.type === 'knock-approved') {
                    lobbyOverlay.style.display = 'none';
                    const call = peer.call(roomId, localStream);
                    handleIncomingCall(call);
                } else if(data.type === 'knock-denied') {
                    alert("Host ne aapki request reject kar di!");
                    location.reload();
                } else if(data.type === 'peer-list') {
                    data.peers.forEach(peerId => {
                        if(peerId !== myId && !peersConnected[peerId]) {
                            const call = peer.call(peerId, localStream);
                            handleIncomingCall(call);
                        }
                    });
                }
            });
        });

        function handleIncomingDataConnection(conn) {
            conn.on('data', (data) => {
                if(isHost && data.type === 'knock-request') {
                    currentKnockConnection = conn;
                    requesterName.innerText = `User (${data.guestId.substring(0,5)}...)`;
                    requestPopup.style.display = 'block';
                }
            });
        }

        acceptKnockBtn.addEventListener('click', () => {
            if(currentKnockConnection) {
                currentKnockConnection.send({ type: 'knock-approved' });
                requestPopup.style.display = 'none';
                
                setTimeout(() => {
                    broadcastPeerList();
                }, 2000);
            }
        });

        denyKnockBtn.addEventListener('click', () => {
            if(currentKnockConnection) {
                currentKnockConnection.send({ type: 'knock-denied' });
                requestPopup.style.display = 'none';
            }
        });

        function broadcastPeerList() {
            const currentParticipants = Object.keys(peersConnected);
            currentParticipants.push(myId); 
            
            peer.connections && Object.keys(peer.connections).forEach(id => {
                const conns = peer.connections[id];
                conns.forEach(c => {
                    if(c.open && c.send) {
                        c.send({ type: 'peer-list', peers: currentParticipants });
                    }
                });
            });
        }

        function handleIncomingCall(call) {
            const remotePeerId = call.peer;
            if (peersConnected[remotePeerId]) return;

            call.on('stream', (remoteStream) => {
                if(document.getElementById(`card-${remotePeerId}`)) return;

                const card = document.createElement('div');
                card.className = 'video-card';
                card.id = `card-${remotePeerId}`;
                
                const tag = document.createElement('div');
                tag.className = 'user-tag';
                tag.innerHTML = `<span class="material-icons-outlined" style="font-size: 14px;">people</span> User (${remotePeerId.substring(0,5)})`;
                
                const videoEl = document.createElement('video');
                videoEl.autoplay = true;
                videoEl.playsInline = true;
                videoEl.srcObject = remoteStream;

                card.appendChild(tag);
                card.appendChild(videoEl);
                videoGrid.appendChild(card);

                peersConnected[remotePeerId] = call;
            });

            call.on('close', () => {
                removePeerVideo(remotePeerId);
            });
        }

        function removePeerVideo(peerId) {
            const card = document.getElementById(`card-${peerId}`);
            if(card) card.remove();
            delete peersConnected[peerId];
        }

        copyLinkBtn.addEventListener('click', () => {
            if(!roomId) return;
            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(inviteUrl);
            alert("Invite Link copy ho gaya hai!");
        });

        // SCREEN SHARE CODE (Safe UI check for Mobile)
        screenBtn.addEventListener('click', async () => {
            if(!navigator.mediaDevices.getDisplayMedia) {
                return alert("Mobile browsers me directly HTML screenshare standard WebRTC support nahi karta. Kisi desktop device ka use karein.");
            }
            if (!isScreenSharing) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ 
                        video: { 
                            width: { ideal: 1920, max: 3840 },  
                            height: { ideal: 1080, max: 2160 },
                            frameRate: { ideal: 30, max: 60 },  
                            displaySurface: "monitor",
                            logicalSurface: true
                        }, 
                        audio: true 
                    });

                    const videoTrack = screenStream.getVideoTracks()[0];
                    if ('contentHint' in videoTrack) {
                        videoTrack.contentHint = 'detail'; 
                    }

                    isScreenSharing = true;
                    screenBtn.classList.add('active-green');
                    localVideo.classList.remove('mirror'); 
                    localVideo.srcObject = screenStream;

                    Object.values(peersConnected).forEach(call => {
                        if (call.peerConnection) {
                            const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                            if (sender) sender.replaceTrack(videoTrack);
                        }
                    });

                    videoTrack.onended = () => { stopScreenShare(); };
                } catch (err) { console.error(err); }
            } else { stopScreenShare(); }
        });

        function stopScreenShare() {
            if (!isScreenSharing) return;
            screenStream.getTracks().forEach(track => track.stop());
            isScreenSharing = false;
            screenBtn.classList.remove('active-green');
            localVideo.classList.add('mirror'); 
            localVideo.srcObject = localStream;

            Object.values(peersConnected).forEach(call => {
                if (call.peerConnection) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = call.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }
            });
        }

        pipBtn.addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (document.pictureInPictureEnabled) {
                    await localVideo.requestPictureInPicture();
                }
            } catch (error) { console.error(error); }
        });

        // MIXED AUDIO RECORDER CODE
        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    if(!navigator.mediaDevices.getDisplayMedia) {
                        return alert("Is mobile browser par call recording setup enabled nahi hai.");
                    }
                    let captureStream = isScreenSharing ? screenStream : await navigator.mediaDevices.getDisplayMedia({ 
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                        audio: true 
                    });
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    audioDestination = audioContext.createMediaStreamDestination();

                    let hasAudioSource = false;

                    if (localStream && localStream.getAudioTracks().length > 0) {
                        const micSource = audioContext.createMediaStreamSource(localStream);
                        micSource.connect(audioDestination);
                        hasAudioSource = true;
                    }

                    if (captureStream && captureStream.getAudioTracks().length > 0) {
                        const systemAudioSource = audioContext.createMediaStreamSource(captureStream);
                        systemAudioSource.connect(audioDestination);
                        hasAudioSource = true;
                    }

                    const videoTrack = captureStream.getVideoTracks()[0];
                    const mixedAudioTrack = hasAudioSource ? audioDestination.stream.getAudioTracks()[0] : null;

                    const finalTracks = [videoTrack];
                    if (mixedAudioTrack) finalTracks.push(mixedAudioTrack);
                    
                    combinedStream = new MediaStream(finalTracks);
                    recordedChunks = [];

                    let options = { mimeType: 'video/webm; codecs=vp9' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm; codecs=vp8' };
                        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                            options = { mimeType: 'video/webm' };
                        }
                    }

                    mediaRecorder = new MediaRecorder(combinedStream, options);
                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                    
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `meet-recording-${Date.now()}.webm`;
                        a.click();

                        if (audioContext) {
                            audioContext.close();
                        }
                    };

                    mediaRecorder.start(1000);
                    isRecording = true;
                    recordBtn.classList.add('active-red');
                } catch (err) { 
                    console.error(err);
                    alert("Recording start nahi ho saki."); 
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('active-red');
            }
        });
    </script>
</body>
</html>
